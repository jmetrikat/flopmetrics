name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Validate project and lockfile
        run: poetry check --lock
      - name: Install lint dependencies
        run: poetry sync --only dev --no-root
      - name: Lint Python sources
        run: poetry run ruff check .
      - name: Check Python syntax
        run: poetry run python -m compileall -q flopmetrics experiments tests
      - name: Build wheel and source distribution
        run: poetry build

  smoke-tests:
    name: CPU smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Install locked runtime dependencies
        run: poetry sync --only main
      - name: Run smoke tests without GPUs or model downloads
        run: poetry run python -m unittest discover -s tests -v
